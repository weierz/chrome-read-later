# Install as /etc/nginx/sites-enabled/readlater.weierz.com on dmit.
# Cloudflare proxies the domain; the origin serves the landing page from the
# release that scripts/deploy-landing.sh last published.
server {
    listen 80;
    listen [::]:80;
    server_name readlater.weierz.com;
    include /etc/nginx/snippets/weierz-cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/readlater-acme;
    }
    location / {
        return 301 https://readlater.weierz.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name readlater.weierz.com;
    include /etc/nginx/snippets/weierz-cloudflare-realip.conf;
    root /var/www/readlater.weierz.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/readlater.weierz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/readlater.weierz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # File names are not hashed, so pages, scripts, and styles revalidate.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
