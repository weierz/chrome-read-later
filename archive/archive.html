<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive · Read Later</title>
    <link rel="stylesheet" href="archive.css">
    <script type="module" src="archive.js"></script>
</head>
<body>
<header class="app-header">
    <a class="brand" href="archive.html" aria-label="Read Later archive">
        <img src="../icons/logo-orange48x48.png" alt="">
        <span>Read Later</span>
    </a>
    <a class="settings-link" href="../options/options.html#archive">Archive settings</a>
</header>

<main>
    <header class="archive-header">
        <div>
            <p class="eyebrow">Stored on this computer</p>
            <h1>Archive</h1>
            <p class="lede">Previously saved reading list items.</p>
        </div>
        <p id="archiveCount" class="archive-count" aria-live="polite">Loading…</p>
    </header>

    <section class="archive-workspace" aria-labelledby="archive-list-title">
        <h2 id="archive-list-title" class="visually-hidden">Archived items</h2>
        <div class="toolbar">
            <label class="search-field" for="archiveSearch">
                <span class="visually-hidden">Search archive</span>
                <input id="archiveSearch" type="search" autocomplete="off"
                       placeholder="Search titles and URLs">
            </label>
            <span id="resultSummary" class="result-summary"></span>
        </div>

        <p id="pageStatus" class="page-status" role="status" aria-live="polite"></p>
        <ol id="archiveList" class="archive-list"></ol>

        <div id="emptyState" class="empty-state" hidden>
            <img src="../icons/archive.svg" alt="">
            <h2 id="emptyTitle">Archive is empty</h2>
            <p id="emptyMessage">Items you save will appear here.</p>
        </div>

        <button id="loadMore" class="load-more" type="button" hidden>Show more</button>
    </section>
</main>

<div id="undoToast" class="undo-toast" role="status" aria-live="polite" hidden>
    <span>Removed from Archive.</span>
    <button id="undoRemove" type="button">Undo</button>
</div>
</body>
</html>
