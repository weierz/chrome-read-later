<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive · Read Later</title>
    <link rel="stylesheet" href="archive.css">
    <script type="module" src="archive.js"></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="archive.html">
        <img src="../icons/logo-orange48x48.png" alt="">
        <span>Archive</span>
        <span id="archiveCount" class="brand-count" aria-live="polite"></span>
    </a>

    <label class="search" for="archiveSearch">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.75"/>
            <path d="m10.5 10.5 3.25 3.25"/>
        </svg>
        <span class="visually-hidden">Search archive</span>
        <input id="archiveSearch" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search" title="Search titles and URLs">
        <kbd class="search-key" aria-hidden="true">/</kbd>
    </label>

    <a class="settings-link" href="../options/options.html#archive"
       title="Archive settings" aria-label="Archive settings">
        <img src="../icons/options.svg" alt="">
    </a>
</header>

<div class="layout">
    <nav class="sites" aria-label="Sites">
        <ul id="siteList" class="site-list"></ul>
    </nav>

    <main class="timeline" aria-labelledby="archive-list-title">
        <h1 id="archive-list-title" class="visually-hidden">Archive</h1>
        <p id="pageStatus" class="page-status" role="status" aria-live="polite"></p>
        <div id="archiveGroups"></div>
        <div id="loadSentinel" class="load-sentinel" aria-hidden="true"></div>

        <div id="emptyState" class="empty-state" hidden>
            <img src="../icons/archive.svg" alt="">
            <h2 id="emptyTitle">Archive is empty</h2>
            <p id="emptyMessage">Items you save will appear here.</p>
            <button id="clearFilters" class="clear-filters" type="button" hidden>Clear search</button>
        </div>
    </main>
</div>

<div id="undoToast" class="undo-toast" role="status" aria-live="polite" hidden>
    <span>Removed</span>
    <button id="undoRemove" type="button">Undo</button>
</div>
</body>
</html>
