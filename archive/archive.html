<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive · Read Later</title>
    <link rel="stylesheet" href="archive.css">
    <script type="module" src="archive.js"></script>
</head>
<body>
<div class="settings-app">
    <aside class="sidebar">
        <a class="brand" href="archive.html" aria-label="Read Later archive">
            <img src="../icons/logo-orange48x48.png" alt="">
            <span>
                <strong>Read Later</strong>
                <small>Archive</small>
            </span>
        </a>

        <nav id="siteList" class="sidebar-nav site-nav" aria-label="Sites"></nav>

        <footer class="status-bar">
            <span id="count">
                <span id="row">0</span><span class="count-separator" aria-hidden="true"> / </span><span id="total">0</span>
            </span>
            <a id="options" href="../options/options.html#archive" data-tooltip="Archive options (,)"
               aria-label="Archive options" aria-keyshortcuts=",">
                <img src="../icons/options.svg" alt="">
            </a>
            <button type="button" id="question" data-tooltip="Help and feedback (?)"
                    aria-label="Help and feedback" aria-keyshortcuts="?">
                <img src="../icons/question.svg" alt="">
            </button>
        </footer>
    </aside>

    <main class="content">
        <h1 class="visually-hidden">Archive</h1>

        <div class="search-bar">
            <label class="search" for="archiveSearch">
                <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.75"/>
                    <path d="m10.5 10.5 3.25 3.25"/>
                </svg>
                <span class="visually-hidden">Search archive</span>
                <input id="archiveSearch" type="search" autocomplete="off" spellcheck="false"
                       placeholder="Search" aria-keyshortcuts="/">
                <kbd aria-hidden="true">/</kbd>
            </label>
        </div>

        <div id="archiveGroups"></div>
        <div id="loadSentinel" class="load-sentinel" aria-hidden="true"></div>

        <div id="emptyState" class="option-list empty-state" hidden>
            <strong id="emptyTitle">Archive is empty</strong>
            <span id="emptyMessage">Items you save will appear here.</span>
        </div>
    </main>
</div>

<p id="pageStatus" class="toast" role="status" aria-live="polite"></p>
<div id="undoToast" class="toast undo-toast" role="status" aria-live="polite" hidden>
    <span>Removed</span>
    <button id="undoRemove" type="button" data-tooltip="u">Undo</button>
</div>
</body>
</html>
